services:
  # ==========================================
  # ZONA: DIVISIÓN POLÍTICA (MongoDB)
  # ==========================================
  bd-division-politica:
    image: mongo:7.0
    container_name: bd_division_politica
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - red-empresarial
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-division-politica:
    build: ./DivisionPolitica_FIXED
    container_name: api_division_politica
    restart: always
    ports:
      - "3040:3030"
    environment:
      - MONGO_URI=mongodb://bd-division-politica:27017/division_politica
    depends_on:
      bd-division-politica:
        condition: service_healthy
    networks:
      - red-empresarial

  # ==========================================
  # ZONA: CAMBIO MONEDAS (PostgreSQL)
  # ==========================================
  bd-monedas:
    image: postgres:15
    container_name: bd_monedas
    restart: always
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASS}
      - POSTGRES_DB=${PG_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - red-empresarial
    healthcheck:
      # Adaptado para leer dinámicamente las variables de tu archivo .env
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-monedas:
    build: ./CambioMonedas_Fixed
    container_name: api_monedas
    restart: always
    ports:
      - "8091:3000"
    environment:
      - DATABASE_URL=postgresql://${PG_USER}:${PG_PASS}@bd-monedas:5432/${PG_DB}
    depends_on:
      bd-monedas:
        condition: service_healthy
    networks:
      - red-empresarial

  # ==========================================
  # ZONA: CALENDARIO LABORAL (Independiente)
  # ==========================================
  api-calendario:
    build: ./CalendarioLaboral_FIXED
    container_name: api_calendario
    restart: always
    ports:
      - "3000:3000"
    networks:
      - red-empresarial

networks:
  red-empresarial:
    driver: bridge

volumes:
  mongo-data:
  postgres-data: